name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./Install-LocalAI.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]   # PowerShell 7 and Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v4
      - name: Pester (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) { Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null }
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python3 -c "import json;d=json.load(open('manifest/openlayer-requirements.json'));assert d['schemaVersion']==1;print(len(d['models']),'models,',len(d['customNodes']),'custom node packages')"
