name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./Install-LocalAI.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [core, desktop]   # PowerShell 7 and Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v4
      - name: Pester on PowerShell 7
        if: matrix.edition == 'core'
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
      - name: Pester on Windows PowerShell 5.1
        if: matrix.edition == 'desktop'
        shell: powershell
        run: ./tests/Invoke-Tests.ps1

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python3 -c "import json;d=json.load(open('manifest/openlayer-requirements.json'));assert d['schemaVersion']==1;print(len(d['models']),'models,',len(d['customNodes']),'custom node packages')"
